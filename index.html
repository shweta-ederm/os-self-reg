<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dermatology of Boca | Schedule an Appointment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT:'#7ba8a0', 50:'#f0f7f6', 100:'#daecea', 500:'#5d8f87' }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .slot-pill { font-size:.65rem; padding:2px 7px; border-radius:4px; border:1px solid #7ba8a0; color:#7ba8a0; cursor:pointer; display:block; text-align:center; white-space:nowrap; transition:all .15s; }
    .slot-pill:hover { background:#7ba8a0; color:#fff; }
    .slot-none { font-size:.65rem; color:#d1d5db; display:block; text-align:center; white-space:nowrap; }
  </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden flex flex-col">

<!-- ── HEADER ───────────────────────────────────────────── -->
<header class="bg-white border-b border-gray-200 shrink-0 z-50">

  <!-- Row 1: Logo + Search + Steps + Login -->
  <div class="flex items-center h-14 px-4 gap-3">
    <img src="src/assets/logo.jpg" alt="Dermatology of Boca" class="h-8 object-contain shrink-0">

    <!-- Search inputs -->
    <div class="flex items-center border border-gray-300 rounded-lg overflow-hidden flex-1 max-w-md ml-2">
      <div class="flex items-center px-3 border-r border-gray-200 gap-1.5 shrink-0">
        <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
        <input value="Miami, FL" class="text-sm outline-none w-20 py-2 bg-transparent" placeholder="City, State">
      </div>
      <div class="flex items-center px-3 flex-1 gap-1.5">
        <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input value="Dermatology Consultation" class="text-sm outline-none flex-1 py-2 bg-transparent" placeholder="Specialty or condition">
      </div>
    </div>
    <button class="bg-brand hover:bg-brand-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors whitespace-nowrap shrink-0">Search</button>

    <!-- Step indicators + Login -->
    <div class="ml-auto flex items-center gap-1.5 text-xs shrink-0">
      <!-- Step 1: active -->
      <div class="flex items-center gap-1.5">
        <div class="w-5 h-5 rounded-full bg-brand flex items-center justify-center shrink-0">
          <span class="text-white font-bold" style="font-size:10px">1</span>
        </div>
        <span class="font-semibold text-brand whitespace-nowrap">Choose Provider</span>
      </div>
      <div class="w-5 h-px bg-gray-300 shrink-0"></div>
      <!-- Step 2 -->
      <div class="flex items-center gap-1.5 opacity-50">
        <div class="w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center shrink-0">
          <span class="text-gray-400 font-bold" style="font-size:10px">2</span>
        </div>
        <span class="text-gray-400 whitespace-nowrap">Select Time</span>
      </div>
      <div class="w-5 h-px bg-gray-300 shrink-0"></div>
      <!-- Step 3 -->
      <div class="flex items-center gap-1.5 opacity-50">
        <div class="w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center shrink-0">
          <span class="text-gray-400 font-bold" style="font-size:10px">3</span>
        </div>
        <span class="text-gray-400 whitespace-nowrap">Confirm Details</span>
      </div>
      <div class="w-5 h-px bg-gray-300 shrink-0"></div>
      <!-- Step 4 -->
      <div class="flex items-center gap-1.5 opacity-50">
        <div class="w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center shrink-0">
          <span class="text-gray-400 font-bold" style="font-size:10px">4</span>
        </div>
        <span class="text-gray-400 whitespace-nowrap">Complete</span>
      </div>
      <!-- Login -->
      <div class="ml-3 border-l border-gray-200 pl-3">
        <a href="patient-portal.html" class="flex items-center gap-1 text-gray-500 hover:text-brand">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span class="text-xs">Log In</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Row 2: Filter controls -->
  <div class="px-4 py-1.5 flex items-center gap-2 text-xs border-t border-gray-100">

    <!-- Left group: count, date chips, view toggles -->
    <span class="text-gray-500 whitespace-nowrap mr-0.5">4 providers</span>

    <button class="flex items-center gap-1 bg-brand text-white px-2.5 py-1 rounded-full text-xs font-medium whitespace-nowrap">
      <svg class="w-3 h-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      Thu May 14
    </button>
    <button class="flex items-center gap-1 border border-gray-300 text-gray-600 px-2.5 py-1 rounded-full text-xs whitespace-nowrap hover:border-brand hover:text-brand transition-colors">
      Today
    </button>

    <button class="flex items-center gap-1 text-gray-500 hover:text-brand text-xs whitespace-nowrap ml-1">
      <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
      Hide map
    </button>
    <button class="flex items-center gap-1 text-gray-500 hover:text-brand text-xs whitespace-nowrap">
      <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Hide opening hours
    </button>

    <!-- Right group: filter actions -->
    <div class="ml-auto flex items-center gap-2 shrink-0">
      <!-- Filter icon -->
      <button class="text-gray-400 hover:text-brand p-0.5">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
      </button>
      <!-- In person only -->
      <button class="flex items-center gap-1 border border-gray-300 text-gray-600 px-2.5 py-1 rounded text-xs whitespace-nowrap hover:border-brand hover:text-brand transition-colors">
        <svg class="w-3 h-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        In person only
      </button>
      <!-- Connect -->
      <button class="flex items-center gap-1 bg-brand text-white px-2.5 py-1 rounded text-xs font-medium whitespace-nowrap">
        <svg class="w-3 h-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        Connect
      </button>
      <!-- Language dropdown -->
      <select class="border border-gray-200 rounded px-2 py-1 text-xs text-gray-600 outline-none bg-white">
        <option>Language</option>
        <option>English</option>
        <option>Spanish</option>
      </select>
      <!-- Insurance dropdown -->
      <select class="border border-gray-200 rounded px-2 py-1 text-xs text-gray-600 outline-none bg-white">
        <option>Insurance</option>
        <option>Aetna</option>
        <option>Blue Cross Blue Shield</option>
        <option>UnitedHealthcare</option>
        <option>Medicare</option>
      </select>
      <!-- Load More -->
      <button class="flex items-center gap-1 border border-gray-200 text-gray-600 px-2.5 py-1 rounded text-xs whitespace-nowrap hover:border-brand hover:text-brand transition-colors">
        Load More
        <svg class="w-3 h-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ── MAIN SPLIT ───────────────────────────────────────── -->
<div class="flex flex-1 overflow-hidden">

  <!-- Provider list (left) -->
  <div class="w-[480px] shrink-0 overflow-y-auto bg-white border-r border-gray-100">
    <div id="providers"></div>
  </div>

  <!-- Map (right) -->
  <div class="flex-1 relative">
    <iframe
      src="https://www.openstreetmap.org/export/embed.html?bbox=-80.28%2C26.22%2C-79.94%2C26.55&layer=mapnik"
      class="w-full h-full border-0" loading="lazy" title="Provider map"></iframe>
    <div class="absolute bottom-4 left-4 bg-white rounded-xl shadow-lg p-3 w-48">
      <p class="text-xs font-semibold text-gray-700 mb-2">Provider Locations</p>
      <div id="mapLegend"></div>
    </div>
  </div>
</div>

<script>
const PROVIDERS = [
  { id:1, name:'Dr. Sarah Mitchell', cred:'MD, FAAD', spec:'Dermatologist', rating:4.8, reviews:214, city:'Miami, FL', dist:'1.2 mi', photo:'https://randomuser.me/api/portraits/women/44.jpg',
    avail:[{label:'Today',slots:['10:00 AM','2:00 PM']},{label:'Tomorrow',slots:['8:00 AM','9:00 AM']},{label:'Wed May 16',slots:['9:30 AM']},{label:'Thu May 17',slots:['4:00 PM']},{label:'Mon May 18',slots:['8:30 AM']}] },
  { id:2, name:'Dr. Emily Rodriguez', cred:'MD, FAAD', spec:'Dermatologist', rating:4.6, reviews:178, city:'Boca Raton, FL', dist:'0.8 mi', photo:'https://randomuser.me/api/portraits/women/65.jpg',
    avail:[{label:'Today',slots:['3:00 PM']},{label:'Tomorrow',slots:['8:00 AM','10:00 AM']},{label:'Wed May 16',slots:['1:00 PM','2:30 PM']},{label:'Thu May 17',slots:['9:00 AM']},{label:'Mon May 18',slots:[]}] },
  { id:3, name:'Dr. Jared Chen', cred:'MD, FAOCD', spec:'Dermatologist', rating:4.7, reviews:203, city:'Boca Raton, FL', dist:'1.5 mi', photo:'https://randomuser.me/api/portraits/men/32.jpg',
    avail:[{label:'Today',slots:[]},{label:'Tomorrow',slots:[]},{label:'Wed May 16',slots:['10:00 AM','3:00 PM']},{label:'Thu May 17',slots:['8:30 AM']},{label:'Mon May 18',slots:['9:00 AM']}] },
  { id:4, name:'Dr. Robert Williams', cred:'MD', spec:'Dermatologist', rating:4.3, reviews:156, city:'Boca Raton, FL', dist:'2.1 mi', photo:'https://randomuser.me/api/portraits/men/55.jpg',
    avail:[{label:'Today',slots:['1:00 PM','4:00 PM']},{label:'Tomorrow',slots:['10:30 AM']},{label:'Wed May 16',slots:['9:00 AM']},{label:'Thu May 17',slots:['11:00 AM']},{label:'Mon May 18',slots:['3:00 PM']}] },
  { id:5, name:'Dr. Jennifer Park', cred:'MD, FAAD', spec:'Cosmetic Dermatologist', rating:4.9, reviews:312, city:'Miami, FL', dist:'2.3 mi', photo:'https://randomuser.me/api/portraits/women/51.jpg',
    avail:[{label:'Today',slots:[]},{label:'Tomorrow',slots:[]},{label:'Wed May 16',slots:[]},{label:'Thu May 17',slots:[]},{label:'Mon May 18',slots:['8:00 PM']}] },
  { id:6, name:'Dr. Michael Thompson', cred:'MD, FAAD', spec:'Dermatologist', rating:4.7, reviews:189, city:'Boca Raton, FL', dist:'3.0 mi', photo:'https://randomuser.me/api/portraits/men/41.jpg',
    avail:[{label:'Today',slots:[]},{label:'Tomorrow',slots:['9:00 AM','1:00 PM']},{label:'Wed May 16',slots:['10:00 AM']},{label:'Thu May 17',slots:['8:00 AM']},{label:'Mon May 18',slots:['11:00 AM']}] },
];

function stars(r){
  const full = Math.floor(r);
  return '<span class="text-yellow-400">' + '★'.repeat(full) + '</span>';
}

function renderProviders(){
  const el = document.getElementById('providers');
  const legend = document.getElementById('mapLegend');

  el.innerHTML = PROVIDERS.map(p => `
    <div class="border-b border-gray-100 p-4 hover:bg-gray-50 cursor-pointer transition-colors">
      <div class="flex gap-3">
        <!-- Photo -->
        <img src="${p.photo}" alt="${p.name}"
          class="w-12 h-12 rounded-full object-cover shrink-0 border border-gray-100"
          onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=7ba8a0&color=fff'">
        <!-- Info -->
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <a href="provider-detail.html?id=${p.id}" class="text-brand font-semibold text-sm hover:underline leading-tight block truncate">
                ${p.name}, ${p.cred}
              </a>
              <div class="flex items-center gap-1 mt-0.5">
                ${stars(p.rating)}
                <span class="text-xs font-medium text-gray-700">${p.rating}</span>
                <span class="text-xs text-gray-400">(${p.reviews} reviews)</span>
              </div>
              <p class="text-xs text-gray-500 mt-0.5">${p.spec}</p>
            </div>
            <div class="flex gap-1 shrink-0">
              <button class="w-6 h-6 flex items-center justify-center border border-gray-200 rounded hover:border-brand transition-colors">
                <svg class="w-3 h-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
              </button>
              <button class="w-6 h-6 flex items-center justify-center border border-gray-200 rounded hover:border-brand transition-colors">
                <svg class="w-3 h-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"/></svg>
              </button>
            </div>
          </div>
          <div class="flex items-center gap-1 mt-1">
            <svg class="w-3 h-3 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
            <span class="text-xs text-gray-400">${p.dist} · ${p.city}</span>
            <span class="ml-1 text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded">In person</span>
          </div>
        </div>
      </div>

      <!-- Availability grid -->
      <div class="mt-3 grid grid-cols-5 gap-1.5">
        ${p.avail.map(d => `
          <div>
            <p class="text-xs text-gray-400 mb-1 text-center truncate">${d.label}</p>
            <div class="flex flex-col gap-1">
              ${d.slots.length
                ? d.slots.slice(0,2).map(s => `<a href="select-time.html?provider=${p.id}" class="slot-pill">${s}</a>`).join('')
                : `<span class="slot-none">No openings</span>`
              }
            </div>
          </div>
        `).join('')}
      </div>

      <!-- Footer links -->
      <div class="mt-2.5 flex items-center gap-3">
        <a href="provider-detail.html?id=${p.id}" class="text-xs text-brand hover:underline">More times available →</a>
        <a href="provider-detail.html?id=${p.id}" class="text-xs text-brand hover:underline">View profile</a>
      </div>
    </div>
  `).join('');

  legend.innerHTML = PROVIDERS.slice(0, 4).map(p => `
    <div class="flex items-center gap-2 mb-1.5">
      <div class="w-5 h-5 rounded-full bg-brand text-white text-xs flex items-center justify-center font-bold shrink-0">${p.id}</div>
      <span class="text-xs text-gray-600 truncate">${p.name.replace('Dr. ', '')}</span>
    </div>
  `).join('');
}

renderProviders();
</script>
</body>
</html>
